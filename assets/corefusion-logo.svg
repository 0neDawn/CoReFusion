      <stop stop-color="#FB7185"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="cool" x1="65" y1="24" x2="144" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="fusion" x1="58" y1="58" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-12 60 80)">
    <rect x="20" y="30" width="80" height="104" rx="20" fill="url(#warm)"/>
    <circle cx="42" cy="54" r="7" fill="white" fill-opacity=".9"/>
